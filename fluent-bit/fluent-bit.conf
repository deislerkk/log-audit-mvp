[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info

[INPUT]
    Name        tail
    Path        /var/log/myapp.log
    Tag         myapp
    DB          /var/log/flb_kv.db
    Read_from_Head On
    Refresh_Interval 5

[OUTPUT]
    Name        es
    Match       *
    Host        opensearch
    Port        9200
    Index       logs
    Type        _doc
    HTTP_User   admin
    HTTP_Passwd admin
    Logstash_Format On
    Retry_Limit False
